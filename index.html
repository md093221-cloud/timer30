<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-Minute Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f4f9;
      color: #333;
    }
    .timer-card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: 320px;
    }
    h1 {
      font-size: 1.25rem;
      color: #666;
      margin-bottom: 1.5rem;
    }
    .display {
      font-size: 4rem;
      font-weight: 700;
      font-family: monospace;
      color: #2c3e50;
      margin-bottom: 2rem;
    }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      flex: 1;
      padding: 12px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }
    .btn-start {
      background-color: #4caf50;
      color: white;
    }
    .btn-start:hover {
      background-color: #45a049;
    }
    .btn-pause {
      background-color: #ff9800;
      color: white;
    }
    .btn-pause:hover {
      background-color: #e68a00;
    }
    .btn-reset {
      background-color: #f44336;
      color: white;
    }
    .btn-reset:hover {
      background-color: #da190b;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="timer-card">
    <h1>1-Minute Timer</h1>
    <div class="display" id="timerDisplay">01:00</div>
    <div class="controls">
      <button class="btn-start" id="startBtn" onclick="startTimer()">Start</button>
      <button class="btn-pause" id="pauseBtn" onclick="pauseTimer()" disabled>Pause</button>
      <button class="btn-reset" id="resetBtn" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <script>
    const INITIAL_TIME = 60; // 1 minute in seconds
    let timeLeft = INITIAL_TIME;
    let timerId = null;

    const display = document.getElementById('timerDisplay');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    function updateDisplay() {
      const minutes = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const seconds = String(timeLeft % 60).padStart(2, '0');
      display.textContent = `${minutes}:${seconds}`;
    }

    function startTimer() {
      if (timerId !== null) return;
      
      startBtn.disabled = true;
      pauseBtn.disabled = false;

      timerId = setInterval(() => {
        timeLeft--;
        updateDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerId);
          timerId = null;
          startBtn.disabled = false;
          pauseBtn.disabled = true;
          alert('Time is up!');
        }
      }, 1000);
    }

    function pauseTimer() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
        startBtn.disabled = false;
        pauseBtn.disabled = true;
      }
    }

    function resetTimer() {
      pauseTimer();
      timeLeft = INITIAL_TIME;
      updateDisplay();
    }
  </script>

</body>
</html>
